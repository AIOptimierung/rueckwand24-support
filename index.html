<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueckwand24 Kundenservice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0;
      --white: #ffffff;
      --border: #e8e6e0;
      --border2: #d4d2cc;
      --green: #5a8a3c;
      --green-light: #eef4e8;
      --green-mid: #c8ddb8;
      --text: #1a1a18;
      --text2: #6b6b65;
      --text3: #a8a8a2;
      --radius: 18px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .topbar {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 0 4px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--green);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .brand-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .brand-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--green);
      background: var(--green-light);
      border: 1px solid var(--green-mid);
      border-radius: 20px; padding: 5px 12px; font-weight: 500;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .chat-window {
      width: 100%; max-width: 680px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
      display: flex; flex-direction: column;
      height: 74vh; min-height: 500px; max-height: 720px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }
    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    .msg-row { display: flex; gap: 8px; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-row.bot .msg-avatar { background: var(--green); font-size: 15px; }
    .msg-row.user .msg-avatar { background: var(--text); color: white; font-size: 10px; font-weight: 700; }
    .bubble-wrap { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.user .bubble-wrap { align-items: flex-end; }
    .intent-tag {
      font-size: 10px; font-weight: 600; color: var(--green);
      background: var(--green-light); border-radius: 4px;
      padding: 2px 7px; margin-bottom: 5px; width: fit-content;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .bubble { padding: 12px 15px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; }
    .msg-row.bot .bubble {
      background: #f8f7f4; border: 1px solid var(--border);
      border-bottom-left-radius: 4px; color: var(--text);
    }
    .msg-row.user .bubble {
      background: var(--green); border-bottom-right-radius: 4px; color: white;
    }
    .bubble p { margin-bottom: 7px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 600; }
    .bubble ul { padding-left: 0; margin: 4px 0; list-style: none; }
    .bubble li { padding: 2px 0; padding-left: 18px; position: relative; }
    .bubble li::before { content: "→"; position: absolute; left: 0; color: var(--green); font-weight: 600; }
    .bubble .gap { height: 8px; display: block; }
    .typing-row { display: flex; gap: 8px; }
    .typing-bubble {
      padding: 12px 16px; background: #f8f7f4;
      border: 1px solid var(--border); border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bubble span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text3); animation: tb 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes tb { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-5px);opacity:1} }
    .quick-area {
      padding: 10px 16px 8px;
      display: flex; flex-wrap: wrap; gap: 7px;
      border-top: 1px solid var(--border); background: #fafaf8;
    }
    .qr-btn {
      font-size: 12px; font-weight: 500;
      background: var(--white); color: var(--text2);
      border: 1px solid var(--border2); border-radius: 20px;
      padding: 6px 13px; cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .qr-btn:hover { background: var(--green-light); color: var(--green); border-color: var(--green-mid); }
    .input-bar {
      padding: 12px 14px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: flex-end; background: var(--white);
    }
    textarea {
      flex: 1; background: #f8f7f4; border: 1px solid var(--border2);
      border-radius: 12px; padding: 10px 13px; font-family: inherit;
      font-size: 14px; color: var(--text); resize: none; outline: none;
      min-height: 42px; max-height: 110px; line-height: 1.5; transition: border-color 0.15s;
    }
    textarea::placeholder { color: var(--text3); }
    textarea:focus { border-color: var(--green); background: var(--white); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--green); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0; color: white; font-size: 17px;
    }
    .send-btn:hover { background: #4a7a2c; transform: scale(1.04); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .footer {
      width: 100%; max-width: 680px; margin-top: 10px;
      text-align: center; font-size: 11px; color: var(--text3);
    }
    .footer a { color: var(--text3); text-decoration: none; }
    .footer a:hover { color: var(--text2); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">🌿</div>
      <div>
        <div class="brand-name">Rueckwand24</div>
        <div class="brand-sub">Kundenservice</div>
      </div>
    </div>
    <div class="status-pill"><div class="status-dot"></div>Lisa ist online</div>
  </div>

  <div class="chat-window">
    <div class="messages" id="messages"></div>
    <div class="quick-area">
      <button class="qr-btn" onclick="sendQuick('Wann kommt meine Bestellung an?')">📦 Lieferstatus</button>
      <button class="qr-btn" onclick="sendQuick('Wie montiere ich die Rückwand?')">🔧 Montage</button>
      <button class="qr-btn" onclick="sendQuick('Welche Materialien gibt es?')">🪟 Materialien</button>
      <button class="qr-btn" onclick="sendQuick('Meine Rückwand ist beschädigt angekommen')">⚠️ Schaden melden</button>
      <button class="qr-btn" onclick="sendQuick('Ich möchte eine Retoure einleiten')">↩️ Retoure</button>
      <button class="qr-btn" onclick="sendQuick('Kann ich ein eigenes Foto verwenden?')">📷 Eigenes Foto</button>
    </div>
    <div class="input-bar">
      <textarea id="userInput" placeholder="Schreib Lisa eine Nachricht..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="handleSend()">➤</button>
    </div>
  </div>

  <div class="footer">
    Lisa · Rueckwand24 Kundenservice &nbsp;·&nbsp;
    <a href="tel:061176039006">0611 760 390 06</a> &nbsp;·&nbsp;
    <a href="mailto:go@rueckwand24.com">go@rueckwand24.com</a>
  </div>

<script>
  let history = [];
  let busy = false;

  function classifyIntent(t) {
    if (/liefer|wann|kommt|tracking|versand|paket|bestell|status/i.test(t)) return '📦 Lieferung';
    if (/montag|kleb|befestig|anbring|silikon/i.test(t)) return '🔧 Montage';
    if (/material|glas|acryl|alu|keramik|quarz/i.test(t)) return '🪟 Materialien';
    if (/schaden|beschaedigt|kaputt|defekt|reklamation/i.test(t)) return '⚠️ Reklamation';
    if (/retoure|rueckgabe|zurueck|widerruf/i.test(t)) return '↩️ Retoure';
    if (/preis|kosten|zahlung|wie viel/i.test(t)) return '💶 Preis';
    if (/foto|bild|eigenes|motiv|hochlad/i.test(t)) return '📷 Eigenes Motiv';
    if (/mass|groesse|format|breite|cm|mm/i.test(t)) return '📐 Maße';
    return '💬 Anfrage';
  }

  function renderMd(text) {
    const lines = text.split('\n');
    let html = '';
    let inList = false;
    for (let line of lines) {
      line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      if (line.trim().startsWith('→')) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + line.trim().substring(1).trim() + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.trim() === '') {
          html += '<span class="gap"></span>';
        } else {
          html += '<p>' + line.trim() + '</p>';
        }
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function addMessage(role, text, intent) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = role === 'bot' ? '🌿' : 'Du';
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    if (intent && role === 'bot') {
      const tag = document.createElement('div');
      tag.className = 'intent-tag';
      tag.textContent = intent;
      wrap.appendChild(tag);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'bot' ? renderMd(text) : text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    wrap.appendChild(bubble);
    row.appendChild(av);
    row.appendChild(wrap);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'typing-row'; row.id = 'typing';
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.style.cssText = 'background:#5a8a3c;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px;';
    av.textContent = '🌿';
    const bub = document.createElement('div');
    bub.className = 'typing-bubble';
    bub.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(av); row.appendChild(bub);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function send(userText) {
    if (busy || !userText.trim()) return;
    busy = true;
    document.getElementById('sendBtn').disabled = true;
    const intent = classifyIntent(userText);
    addMessage('user', userText.trim());
    history.push({ role: 'user', content: userText.trim() });
    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      hideTyping();
      if (data.error) throw new Error(data.error);
      addMessage('bot', data.reply, intent);
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      hideTyping();
      addMessage('bot', 'Da ist leider etwas schiefgelaufen.\n\nSchreib uns direkt:\n→ go@rueckwand24.com\n→ 0611 760 390 06', '⚠️ Fehler');
    }
    busy = false;
    document.getElementById('sendBtn').disabled = false;
  }

  function handleSend() {
    const inp = document.getElementById('userInput');
    const val = inp.value.trim();
    if (!val || busy) return;
    inp.value = ''; inp.style.height = 'auto'; send(val);
  }

  function sendQuick(text) { if (!busy) send(text); }
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }

  window.addEventListener('load', () => {
    setTimeout(() => {
      addMessage('bot', 'Hey! Ich bin Lisa vom Rueckwand24 Kundenservice.\n\nWomit kann ich dir heute helfen?\n\n→ Lieferstatus checken\n→ Montagefragen\n→ Reklamationen\n→ Materialberatung\n\nEinfach schreiben oder einen der Buttons unten waehlen!');
    }, 300);
  });
</script>
</body>
</html>
